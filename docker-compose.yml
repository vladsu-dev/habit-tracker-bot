x-service: &service
  build: .
  restart: unless-stopped

x-database: &database
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      <<: *database
      POSTGRES_USER: tracker
      POSTGRES_DB: tracker
    volumes:
      - tracker-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    environment: *database
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *service
    environment:
      <<: *database
      BOT_SERVICE_KEY: ${BOT_SERVICE_KEY:?Set BOT_SERVICE_KEY in .env}
    command: uvicorn app.main:app --host 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    <<: *service
    command: python -m app.bot
    environment:
      API_URL: http://api:8000
      BOT_SERVICE_KEY: ${BOT_SERVICE_KEY:?Set BOT_SERVICE_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *service
    command: python -m app.reminders
    environment:
      <<: *database
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  tracker-data:
